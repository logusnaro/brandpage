name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build when package manifest exists
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "::warning::package.json is not present on the default branch; build deferred until the app scaffold is committed."
          fi
