<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앱 영상 · logUs Studio</title><style>
@font-face{font-family:Film;src:url(assets/PretendardVariable.woff2);font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#243c37;font-family:Film,sans-serif}main{max-width:1440px;margin:auto;padding:60px 32px}h1{font-size:clamp(36px,6vw,68px);margin:24px 0}h2{font-size:36px;margin:8px 0}p{color:#64766e;line-height:1.7}.label{letter-spacing:.12em;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:24px 0 36px}.card{border:1px solid #d9ded5;background:#fffdf8;border-radius:24px;overflow:hidden}.card video{width:100%;display:block;background:#edeae4;aspect-ratio:16/9}.portrait video{aspect-ratio:9/16;max-height:520px}.info{padding:20px}.info h3{margin:0 0 8px;font-size:21px}a{color:#396d61;text-underline-offset:4px}.meta{font-size:14px;display:flex;gap:18px;flex-wrap:wrap}.app{padding:40px 0;border-top:1px solid #d9ded5}.portrait{max-width:840px;grid-template-columns:repeat(2,1fr)}.credit{font-size:13px;margin:12px 0}#notice{padding:16px;border-radius:12px;background:#efe5d3}footer{margin-top:40px;font-size:14px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:32px 18px}.grid{grid-template-columns:1fr}.portrait{grid-template-columns:1fr 1fr;gap:12px}.portrait .info{padding:13px}.meta{gap:10px}.portrait video{max-height:360px}}
</style></head><body><main><span class="label">LOGUS STUDIO / APP FILMS</span><h1>작은 앱들, 다양한 하루.</h1><p>MemoGrip · GOODgo · BookBap<br>실제 개발 화면과 logU의 공간으로 만든 소개와 사용 가이드. 내레이션 없이, 제공한 배경음악으로.</p><div id="notice">영상을 준비 중입니다. 완성된 파일부터 아래에 표시됩니다.</div><div id="apps"></div><footer>화면은 예시 데이터입니다. GOODgo는 오프라인 디자인 프리뷰를 사용했습니다.<br>일부 UI는 출시 전 바뀔 수 있습니다. 영상의 공개 사용 전 제공 음원의 이용 조건을 확인해 주세요.</footer></main><script src="storyboard.js"></script><script>
async function load(){const manifest=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),byKey=new Map(manifest.map(m=>[m.key,m]));document.querySelector('#notice').textContent=`${manifest.length} / 15개 완료 · 1080p · 24fps · 음악 포함`;const host=document.querySelector('#apps');host.replaceChildren();
for(const [key,app]of Object.entries(FILMS.apps)){const section=document.createElement('section');section.className='app';const h=document.createElement('h2');h.textContent=app.name;section.append(h);const credit=document.createElement('p');credit.className='credit';credit.textContent='배경음악: '+app.music.replace('.mp3','');section.append(credit);
for(const aspect of ['landscape','portrait']){const grid=document.createElement('div');grid.className='grid '+(aspect==='portrait'?'portrait':'');for(const job of FILMS.jobs.filter(j=>j.app===key&&j.aspect===aspect)){const m=byKey.get(job.key),article=document.createElement('article');article.className='card';if(m){const v=document.createElement('video');v.controls=true;v.preload='none';v.playsInline=true;v.poster=m.poster;v.src=m.file;v.addEventListener('play',()=>document.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()}));article.append(v)}const info=document.createElement('div');info.className='info';const title=document.createElement('h3');title.textContent=job.label;info.append(title);const meta=document.createElement('div');meta.className='meta';meta.append(document.createTextNode(job.duration+'초 · '+(aspect==='portrait'?'9:16':'16:9')));if(m){for(const [label,file]of [['영상 다운로드',m.file],['자막',job.key+'.srt']]){const a=document.createElement('a');a.href=file;a.download=file;a.textContent=label;meta.append(a)}}else meta.append(document.createTextNode('제작 중'));info.append(meta);article.append(info);grid.append(article)}section.append(grid)}host.append(section)} }
load();</script></body></html>
