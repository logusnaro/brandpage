<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Brand;
        src: url("/font.woff2");
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        background: #f3f0e8;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas width="1920" height="1080"></canvas>
    <script>
      const canvas = document.querySelector("canvas"),
        main = canvas.getContext("2d", { alpha: false }),
        sample = document.createElement("canvas");
      sample.width = 1920;
      sample.height = 1080;
      let ctx = main;
      const W = 1920,
        H = 1080,
        clamp = (x) => Math.max(0, Math.min(1, x)),
        smooth = (x) => {
          x = clamp(x);
          return x * x * x * (x * (x * 6 - 15) + 10);
        },
        mix = (a, b, p) => a + (b - a) * p;
      const assets = {};
      window.ready = Promise.all(
        ["village", "aerial", "clouds"].map(
          (name) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => {
                assets[name] = img;
                resolve();
              };
              img.onerror = reject;
              img.src = "/" + name + ".webp";
            }),
        ),
      ).then(() => document.fonts.ready);
      function photo(img, scale, cx, cy, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const s = Math.max(W / img.width, H / img.height) * scale;
        ctx.drawImage(
          img,
          W / 2 - img.width * s * cx,
          H / 2 - img.height * s * cy,
          img.width * s,
          img.height * s,
        );
        ctx.restore();
      }
      function mist(x, y, rx, ry, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(rx, ry);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        g.addColorStop(0, "rgba(250,247,240," + alpha + ")");
        g.addColorStop(0.48, "rgba(250,247,240," + alpha * 0.86 + ")");
        g.addColorStop(1, "rgba(250,247,240,0)");
        ctx.fillStyle = g;
        ctx.fillRect(-1, -1, 2, 2);
        ctx.restore();
      }
      function world(t) {
        ctx.fillStyle = "#f3f0e8";
        ctx.fillRect(0, 0, W, H);
        const approach = smooth((t - 0.55) / 6.2),
          rise = smooth((t - 5.8) / 4),
          cloud = smooth((t - 8.55) / 3.0),
          end = smooth((t - 11.05) / 1.5);
        const anticipation =
          t < 0.8 ? 0.008 * Math.sin(clamp(t / 0.8) * Math.PI) : 0;
        photo(
          assets.village,
          1.08 + approach * 0.2 - anticipation,
          0.51 + approach * 0.013,
          0.52 - approach * 0.026,
        );
        if (rise > 0) {
          photo(
            assets.aerial,
            1.32 - rise * 0.25,
            0.51,
            0.55 - rise * 0.06,
            rise,
          );
          const veil = Math.sin(rise * Math.PI);
          mist(W * 0.35, H * 0.48, 950, 570, veil * 0.64);
          mist(W * 0.85, H * 0.65, 720, 440, veil * 0.56);
        }
        if (cloud > 0) {
          photo(assets.clouds, 1.12 + (1 - cloud) * 0.11, 0.5, 0.5, cloud);
        }
        // Distinct foreground and background speeds, with continuous sub-pixel positioning.
        for (let i = 0; i < 7; i++) {
          const p = i / 6;
          mist(
            -300 + p * 2500 - approach * (130 + p * 140) + cloud * 140,
            H * (0.93 - p * 0.085) - rise * (80 + p * 160),
            370 + p * 120,
            140 + p * 70,
            (0.1 + p * 0.04) * (1 - end),
          );
        }
        if (t > 1.3 && t < 10.5) {
          for (let i = 0; i < 12; i++) {
            const life = clamp((t - 1.3 - i * 0.18) / 7),
              a = Math.sin(life * Math.PI) * 0.42 * (1 - cloud);
            const x = 280 + i * 128 + 120 * Math.sin(life * Math.PI),
              y = H * 0.87 - life * 510 + Math.sin(i * 1.4) * 70;
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = i % 3 === 0 ? "#cf9674" : "#fff5d9";
            ctx.beginPath();
            ctx.ellipse(
              x,
              y,
              2.8 + (i % 3),
              3.2 + (i % 2),
              life * 0.8,
              0,
              Math.PI * 2,
            );
            ctx.fill();
            ctx.restore();
          }
        }
        // Overlapping cloud masses form the reveal; no camera shake.
        if (t > 9) {
          for (let i = 0; i < 9; i++) {
            const r = smooth((t - 9 - i * 0.11) / 2.5);
            mist(
              (i % 2 ? W + 380 : -380) + (i % 2 ? -1 : 1) * r * 700,
              70 + i * 130,
              760,
              390,
              r * 0.82,
            );
          }
        }
        if (end > 0) {
          ctx.fillStyle = "rgba(243,240,232," + end + ")";
          ctx.fillRect(0, 0, W, H);
        }
      }
      window.renderFrame = (t, branded = false) => {
        const speed = smooth((t - 5.8) / 1.4) * (1 - smooth((t - 7.7) / 1.3));
        // Temporal supersampling during the transition creates a short photographic shutter.
        world(t - 0.008 * speed);
        if (speed > 0.02) {
          ctx = sample.getContext("2d", { alpha: false });
          world(t);
          ctx = main;
          ctx.save();
          ctx.globalAlpha = 0.33;
          ctx.drawImage(sample, 0, 0);
          ctx.restore();
        }
        if (branded && t > 11.55) {
          ctx.font = "590 136px Brand";
          const a = ctx.measureText("logUs").width,
            b = ctx.measureText("Studio").width,
            gap = 35,
            left = (W - a - b - gap) / 2;
          const pieces = [
            ["logUs", left, 0],
            ["Studio", left + a + gap, 0.16],
          ];
          for (const [word, x, delay] of pieces) {
            const p = smooth((t - 11.75 - delay) / 1.05);
            ctx.save();
            ctx.globalAlpha = p;
            ctx.fillStyle = "#253b31";
            ctx.font = "590 136px Brand";
            ctx.textAlign = "left";
            ctx.fillText(word, x, 565 + 26 * (1 - p));
            ctx.restore();
          }
          const p = smooth((t - 12.6) / 0.85);
          ctx.globalAlpha = p;
          ctx.fillStyle = "#637168";
          ctx.font = "400 28px Brand";
          ctx.textAlign = "center";
          ctx.fillText("A world of little moments.", W / 2, 655);
          ctx.globalAlpha = 1;
        }
        return canvas.toDataURL("image/jpeg", 0.96).split(",")[1];
      };
    </script>
  </body>
</html>
